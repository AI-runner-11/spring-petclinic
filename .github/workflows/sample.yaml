  deploy-eks:
      name: Deploy to eks
      runs-on: ubuntu-latest
      needs: build-docker-image
      environment: eks
      env:
        GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
      steps:
       - name: Deploy to eks
         run: |
           export BUILD_DATE=$(date +%Y%m%d)
           export BUILD_VERSION=1.${BUILD_DATE}.${{ github.run_number }}.${{ github.run_attempt }}
           echo $GITOPS_REPO
           generate_post_data()
           {
            cat <<EOF
           {
              "event_type":"update-docker-tag",
              "client_payload": {
                "path":"eks/backend-services",
                "service":"spring-petclinic",
                "imageTag":"$BUILD_VERSION"
               }
            }
           EOF
           }

            echo $(generate_post_data)
 
            curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/eks-deployment/dispatches \
            -d "$(generate_post_data)"
